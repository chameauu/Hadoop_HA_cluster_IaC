---
# Stop Hadoop 3-Node cluster services

- name: Stop Job History Server
  hosts: namenode
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Stop Job History Server
      shell: |
        source /home/{{ hadoop_user }}/.bashrc
        {{ hadoop_install_dir }}/bin/mapred --daemon stop historyserver
      args:
        executable: /bin/bash
      ignore_errors: yes

- name: Stop NodeManagers
  hosts: nodemanagers
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Stop NodeManager
      shell: |
        source /home/{{ hadoop_user }}/.bashrc
        {{ hadoop_install_dir }}/bin/yarn --daemon stop nodemanager
      args:
        executable: /bin/bash
      ignore_errors: yes

- name: Stop ResourceManager
  hosts: resourcemanager
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Stop ResourceManager
      shell: |
        source /home/{{ hadoop_user }}/.bashrc
        {{ hadoop_install_dir }}/bin/yarn --daemon stop resourcemanager
      args:
        executable: /bin/bash
      ignore_errors: yes

- name: Stop DataNodes
  hosts: datanodes
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Stop DataNode
      shell: |
        source /home/{{ hadoop_user }}/.bashrc
        {{ hadoop_install_dir }}/bin/hdfs --daemon stop datanode
      args:
        executable: /bin/bash
      ignore_errors: yes

- name: Stop NameNode
  hosts: namenode
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Stop NameNode
      shell: |
        source /home/{{ hadoop_user }}/.bashrc
        {{ hadoop_install_dir }}/bin/hdfs --daemon stop namenode
      args:
        executable: /bin/bash
      ignore_errors: yes

- name: Verify all services stopped
  hosts: hadoop_cluster
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Check for running Hadoop processes
      shell: "jps"
      register: jps_output

    - name: Display remaining processes
      debug:
        msg: "{{ inventory_hostname }}: {{ jps_output.stdout_lines }}"
