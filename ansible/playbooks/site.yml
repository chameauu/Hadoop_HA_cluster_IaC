---
# Main playbook to set up Hadoop 3-Node cluster

- name: Setup common configuration on all nodes
  hosts: all
  become: yes
  roles:
    - common

- name: Install Hadoop on all nodes
  hosts: hadoop_cluster
  become: yes
  roles:
    - hadoop-install

- name: Configure NameNode
  hosts: namenode
  become: yes
  roles:
    - hadoop-namenode

- name: Configure DataNodes
  hosts: datanodes
  become: yes
  roles:
    - hadoop-datanode

- name: Display cluster information
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Show completion message
      debug:
        msg:
          - "===== HADOOP 3-NODE CLUSTER SETUP COMPLETE ====="
          - ""
          - "Next steps to start the cluster:"
          - ""
          - "1. Format NameNode (first time only): make format-namenode"
          - "2. Start cluster: make start"
          - ""
          - "Web UIs:"
          - "- NameNode: http://localhost:9870"
          - "- ResourceManager: http://localhost:8088"
          - "- Job History: http://localhost:19888"
          - ""
          - "Hive (after installation):"
          - "- HiveServer2 Web UI: http://localhost:10002"
