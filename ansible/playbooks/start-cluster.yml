---
# Start Hadoop 3-Node cluster services

- name: Start NameNode
  hosts: namenode
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Check if NameNode is running
      shell: jps | grep -q NameNode
      register: nn_running
      failed_when: false
      changed_when: false

    - name: Start NameNode
      shell: |
        source /home/{{ hadoop_user }}/.bashrc
        {{ hadoop_install_dir }}/bin/hdfs --daemon start namenode
      args:
        executable: /bin/bash
      when: nn_running.rc != 0

    - name: Wait for NameNode to start
      wait_for:
        host: "{{ master1_ip }}"
        port: "{{ dfs_namenode_rpc_port }}"
        delay: 5
        timeout: 60

    - name: Check NameNode status
      shell: "jps | grep NameNode"
      register: nn_status

    - name: Display NameNode status
      debug:
        msg: "NameNode: {{ nn_status.stdout }}"

- name: Start DataNodes
  hosts: datanodes
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Check if DataNode is running
      shell: jps | grep -q DataNode
      register: dn_running
      failed_when: false
      changed_when: false

    - name: Start DataNode
      shell: |
        source /home/{{ hadoop_user }}/.bashrc
        {{ hadoop_install_dir }}/bin/hdfs --daemon start datanode
      args:
        executable: /bin/bash
      when: dn_running.rc != 0

    - name: Wait for DataNode to start
      wait_for:
        port: 9866
        host: "{{ ansible_host }}"
        delay: 5
        timeout: 30

    - name: Check DataNode status
      shell: "jps | grep DataNode"
      register: dn_status

    - name: Display DataNode status
      debug:
        msg: "{{ inventory_hostname }}: {{ dn_status.stdout }}"

- name: Start ResourceManager
  hosts: resourcemanager
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Check if ResourceManager is running
      shell: jps | grep -q ResourceManager
      register: rm_running
      failed_when: false
      changed_when: false

    - name: Start ResourceManager
      shell: |
        source /home/{{ hadoop_user }}/.bashrc
        {{ hadoop_install_dir }}/bin/yarn --daemon start resourcemanager
      args:
        executable: /bin/bash
      when: rm_running.rc != 0

    - name: Wait for ResourceManager to initialize
      pause:
        seconds: 5

    - name: Verify ResourceManager process is running
      shell: jps | grep -q ResourceManager
      register: rm_check

    - name: Display ResourceManager process status
      debug:
        msg: "ResourceManager is running"

- name: Start NodeManagers
  hosts: nodemanagers
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Check if NodeManager is running
      shell: jps | grep -q NodeManager
      register: nm_running
      failed_when: false
      changed_when: false

    - name: Start NodeManager
      shell: |
        source /home/{{ hadoop_user }}/.bashrc
        {{ hadoop_install_dir }}/bin/yarn --daemon start nodemanager
      args:
        executable: /bin/bash
      when: nm_running.rc != 0

    - name: Wait for NodeManager to start
      wait_for:
        port: 8042
        host: "{{ ansible_host }}"
        delay: 3
        timeout: 30

    - name: Check NodeManager status
      shell: "jps | grep NodeManager"
      register: nm_status

    - name: Display NodeManager status
      debug:
        msg: "{{ inventory_hostname }}: {{ nm_status.stdout }}"

- name: Start MapReduce Job History Server
  hosts: namenode
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Create HDFS directories for Job History Server
      shell: |
        source /home/{{ hadoop_user }}/.bashrc
        {{ hadoop_install_dir }}/bin/hdfs dfs -mkdir -p /tmp/mr-history/tmp
        {{ hadoop_install_dir }}/bin/hdfs dfs -mkdir -p /tmp/mr-history/done
        {{ hadoop_install_dir }}/bin/hdfs dfs -chmod -R 1777 /tmp/mr-history
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Check if Job History Server is running
      shell: jps | grep -q JobHistoryServer
      register: jhs_running
      failed_when: false
      changed_when: false

    - name: Start Job History Server
      shell: |
        source /home/{{ hadoop_user }}/.bashrc
        {{ hadoop_install_dir }}/bin/mapred --daemon start historyserver
      args:
        executable: /bin/bash
      when: jhs_running.rc != 0

    - name: Wait for Job History Server to start
      wait_for:
        port: "{{ mapreduce_jobhistory_webapp_port }}"
        delay: 5
        timeout: 30
      ignore_errors: yes

    - name: Display Job History Server status
      debug:
        msg: "Job History Server started on port {{ mapreduce_jobhistory_webapp_port }}"
