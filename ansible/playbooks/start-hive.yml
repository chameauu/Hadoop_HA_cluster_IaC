---
- name: Start Hive Metastore
  hosts: master1
  become: yes
  become_user: "{{ hive_user }}"
  tasks:
    - name: Stop any existing Hive Metastore
      shell: "pkill -f 'org.apache.hadoop.hive.metastore.HiveMetaStore'"
      ignore_errors: yes
      
    - name: Start Hive Metastore
      shell: |
        cd /home/{{ hive_user }}
        export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
        export HADOOP_HOME=/opt/hadoop
        export HIVE_HOME={{ hive_install_dir }}
        export TEZ_HOME=/opt/tez
        export HIVE_CONF_DIR=$HIVE_HOME/conf
        export PATH=$PATH:$HADOOP_HOME/bin:$HIVE_HOME/bin
        nohup $HIVE_HOME/bin/hive --service metastore > {{ hive_install_dir }}/logs/metastore.log 2>&1 &
      args:
        executable: /bin/bash

    - name: Wait for Metastore to start
      wait_for:
        host: localhost
        port: "{{ hive_metastore_port }}"
        delay: 10
        timeout: 120
        state: started

    - name: Check Metastore process
      shell: "jps | grep -i metastore || echo 'Not running yet'"
      register: metastore_status

    - name: Display Metastore status
      debug:
        msg: "Hive Metastore started on {{ master1_ip }}:{{ hive_metastore_port }}"

- name: Start HiveServer2
  hosts: master1
  become: yes
  become_user: "{{ hive_user }}"
  tasks:
    - name: Stop any existing HiveServer2
      shell: "pkill -f 'org.apache.hive.service.server.HiveServer2'"
      ignore_errors: yes
      
    - name: Start HiveServer2
      shell: |
        cd /home/{{ hive_user }}
        export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
        export HADOOP_HOME=/opt/hadoop
        export HIVE_HOME={{ hive_install_dir }}
        export TEZ_HOME=/opt/tez
        export HIVE_CONF_DIR=$HIVE_HOME/conf
        export PATH=$PATH:$HADOOP_HOME/bin:$HIVE_HOME/bin
        nohup $HIVE_HOME/bin/hive --service hiveserver2 > {{ hive_install_dir }}/logs/hiveserver2.log 2>&1 &
      args:
        executable: /bin/bash

    - name: Wait for HiveServer2 to start
      wait_for:
        host: localhost
        port: "{{ hive_server2_port }}"
        delay: 15
        timeout: 180
        state: started

    - name: Check HiveServer2 process
      shell: "jps"
      register: hiveserver2_status

    - name: Display HiveServer2 status
      debug:
        msg: 
          - "HiveServer2 started on {{ master1_ip }}:{{ hive_server2_port }}"
          - "Web UI: http://{{ master1_ip }}:{{ hive_server2_webui_port }}"
          - "Processes: {{ hiveserver2_status.stdout_lines }}"
